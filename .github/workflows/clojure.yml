name: Clojure CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - name: Prepare java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'
    
    - name: Install clojure tools
      uses: DeLaGuardo/setup-clojure@13
      with:
        cli: latest
    
    - name: Cache clojure dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
          ~/.deps.clj
        key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-clojure-
    
    - name: Run tests
      run: clojure -M:test

    - name: Lint (advisory, never fails the build)
      run: clojure -M:lint
      continue-on-error: true
